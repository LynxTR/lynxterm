[package]
name = "lynxterm"
version = "0.1.1"
description = "Open-source SSH client with a self-hosted, end-to-end encrypted vault"
license = "MIT"
edition = "2024"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
data-encoding = "2.11.1"
hkdf = "0.13.0"
keyring = "4.2.0"
reqwest = { version = "0.13.5", features = ["json"] }
russh = "0.64.1"
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2.12.4", features = [] }
tokio = { version = "1.53.3", features = ["sync", "macros", "net", "io-util", "fs"] }
zeroize = { version = "1.9.1", features = ["serde"] }

# Unoptimised Argon2 unusably slow; keep dev unlock near release speed.
[profile.dev.package.argon2]
opt-level = 3
